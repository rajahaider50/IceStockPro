name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: android
        run: |
          gradle assembleRelease --no-daemon

      - name: Find APK
        id: find-apk
        run: |
          APK_DEBUG=$(find android -name "*.apk" -path "*/debug/*" -type f | head -1)
          APK_RELEASE=$(find android -name "*.apk" -path "*/release/*" -type f | head -1)
          echo "debug=$APK_DEBUG" >> $GITHUB_OUTPUT
          echo "release=$APK_RELEASE" >> $GITHUB_OUTPUT
          echo "Debug APK: $APK_DEBUG"
          echo "Release APK: $APK_RELEASE"

      - name: Rename and Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: IceStockPro-debug
          path: ${{ steps.find-apk.outputs.debug }}
          retention-days: 90

      - name: Rename and Upload Release APK
        uses: actions/upload-artifact@v4
        if: steps.find-apk.outputs.release != ''
        with:
          name: IceStockPro-release
          path: ${{ steps.find-apk.outputs.release }}
          retention-days: 90

      - name: Create GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v11.0-apk-${{ github.run_number }}
          name: "IceStock Pro APK v11.0"
          files: |
            ${{ steps.find-apk.outputs.debug }}
            ${{ steps.find-apk.outputs.release }}
          body: |
            ## IceStock Pro - Android APK

            ### Download
            - **IceStockPro-debug.apk** — Debug build (works on all devices)
            - **IceStockPro-release.apk** — Release build (may need "Install from Unknown Sources")

            ### Installation Steps
            1. Download the APK file to your Android phone
            2. Open the file from your Downloads
            3. If prompted, allow **"Install from Unknown Sources"**
            4. Tap **"Install"**
            5. Tap **"Open"** when installation completes

            ### Alternative: Install from Website (Recommended)
            Visit **https://rajahaider50.github.io/IceStockPro/**
            A banner will appear at the bottom — tap **"Install"** for instant installation.
            This method auto-updates and needs no permissions.

            ### What's Inside
            - Dashboard with live stats
            - Stock Management with categories
            - Sales & Cart with machine type tracking
            - Purchase History with profit tracking
            - Reports with PDF export
            - WhatsApp sharing
            - Payment gate with 10 pricing packages
            - Bilingual UI (Roman Urdu + English)
            - Full offline support
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
